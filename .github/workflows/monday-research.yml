name: Weekly Research & Planning

on:
  schedule:
    - cron: "0 0 * * 1"  # 毎週月曜 09:00 JST (UTC 0:00)
  workflow_dispatch:       # 手動実行も可能

jobs:
  research-and-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run researcher
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m agents.researcher

      - name: Run planner
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m agents.planner

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: proposals/${{ github.run_number }}
          title: "【企画PR】${{ github.run_number }} - テーマ10本提案"
          body: |
            ## 今週のテーマ提案

            リサーチ担当・企画担当が自動生成したテーマ10本です。

            **承認方法**: このPRをMergeしてください → 執筆・検品・デザイン・営業が自動起動します
            **差し戻し方法**: このPRをCloseしてください → 来週月曜に再実行されます

            ---
            Generated by `researcher.py` + `planner.py`
          labels: proposals
          add-paths: |
            data/research/
            plans/
