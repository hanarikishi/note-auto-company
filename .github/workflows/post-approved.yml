name: Post-Approved Pipeline

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  write-and-publish:
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'proposals/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run writer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m agents.writer

      - name: Run inspector
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m agents.inspector

      - name: Create Article PR
        id: article-pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: articles/${{ github.run_number }}
          title: "【記事PR】 - 検品済み記事"
          body: |
            ## 検品済み記事

            執筆担当・検品担当が自動生成・修正した記事です。

            **承認方法**: このPRをMergeしてください → デザイン・営業が自動起動します
            **差し戻し方法**: このPRをCloseしてください

            ---
            Generated by `writer.py` + `inspector.py`
          labels: articles
          add-paths: |
            articles/

      - name: Run designer (after article PR merge simulation)
        if: steps.article-pr.outputs.pull-request-number != ''
        env:
          CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
        run: echo "⏭️ Canva APIセットアップ後に有効化 (designer.py)"

      - name: Run marketer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m agents.marketer

      - name: Summary
        run: |
          echo "## ✅ 今週のパイプライン完了" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 記事PR: #${{ steps.article-pr.outputs.pull-request-number }}" >> $GITHUB_STEP_SUMMARY
          echo "- X投稿文: \`data/posts/\` に出力済み" >> $GITHUB_STEP_SUMMARY
          echo "- 次のアクション: 記事PRを確認 → Merge or Close" >> $GITHUB_STEP_SUMMARY
